name: Build VisaAutoAuth APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Official Gradle Wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -alias visahunter -keyalg RSA -keysize 2048 -validity 10000 -storepass visahunter123 -keypass visahunter123 -dname "CN=VisaHunter, OU=Dev, O=VisaHunter, L=Cairo, C=EG"

      - name: Build Signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || true
          mkdir -p release-output
          if [ ! -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
            cp build.log release-output/build-error.txt
          else
            cp app/build/outputs/apk/release/app-release.apk release-output/VisaAutoAuth-v1.0.apk
          fi

      - name: Create GitHub Release (on tag or manual trigger)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: release-output/*
          name: "Visa Auto-Auth Release ${{ github.ref_name }}"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
